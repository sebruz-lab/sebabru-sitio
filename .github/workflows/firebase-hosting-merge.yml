name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: el sitemap saca el <lastmod> de cada pagina
          # de la fecha de su ultimo commit. Con el clon shallow que hace
          # el checkout por defecto, la mayoria saldria sin fecha.
          fetch-depth: 0
      - name: Bajar la calculadora (sebruz-lab/tucarta, version en tucarta.version)
        run: |
          v=$(tr -d '[:space:]' < tucarta.version)
          mkdir -p public/cartas
          curl -sSfL "https://github.com/sebruz-lab/tucarta/releases/download/$v/tucarta-dist.tar.gz" | tar -xz -C public/cartas
          test -f public/cartas/index.html
      - name: Generar el sitemap (despues de bajar la calculadora, para que /cartas entre)
        run: node .github/scripts/generar-sitemap.mjs
      # Clavada al SHA de v0 (23/11/2026) y no a la etiqueta: "v0" es movil, y
      # esta action recibe el service account del hosting. Para subirla hay que
      # releer el diff de la action, no solo mover el numero.
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SEBABRU_E5563 }}
          channelId: live
          projectId: sebabru-e5563
