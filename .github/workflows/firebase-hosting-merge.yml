# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar la calculadora (sebruz-lab/tucarta, version en tucarta.version)
        run: |
          v=$(tr -d '[:space:]' < tucarta.version)
          mkdir -p public/cartas
          curl -sSfL "https://github.com/sebruz-lab/tucarta/releases/download/$v/tucarta-dist.tar.gz" | tar -xz -C public/cartas
          test -f public/cartas/index.html
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SEBABRU_E5563 }}
          channelId: live
          projectId: sebabru-e5563
