name: Sync Instagram permalink

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Con el GITHUB_TOKEN por defecto, el commit que hace esta Action NO
      # dispara el workflow de deploy: GitHub no encadena workflows para evitar
      # recursion. Resultado: el cambio quedaba en el repo y no llegaba al
      # sitio hasta el siguiente push a mano. Con el PAT, el push es de una
      # persona y el deploy corre.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # sharp achica las seis imagenes a webp. Se instala aca y no en el repo:
      # el sitio es estatico y no tiene package.json en la raiz.
      - name: Instalar sharp
        run: npm install --no-save sharp@0.33.5

      - name: Renovar token, actualizar secreto y rearmar la grilla
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: node .github/scripts/sync-instagram.mjs

      - name: Commitear cambios si la grilla cambio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: actualizar la grilla de Instagram"
          file_pattern: public/index.html public/img/ig
