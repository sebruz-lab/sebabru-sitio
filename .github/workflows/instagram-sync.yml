name: Sync Instagram permalink

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

# El GITHUB_TOKEN de este job solo clona. El push va con el GH_PAT, a mano y
# en su propio paso, asi que aca no hace falta permiso de escritura.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false para que el token del push NO quede escrito
      # en .git/config, donde lo podria leer cualquier paso posterior: el
      # postinstall de sharp, por ejemplo. Se pasa a mano y solo en los dos
      # pasos que hablan con el remoto.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # El GH_PAT necesita DOS permisos: "Secrets: write" para volver a
      # guardar IG_ACCESS_TOKEN, y "Contents: write" para el push. Si falta el
      # segundo, el 403 aparecia al final, despues de renovar el token y bajar
      # las seis imagenes (paso el 23/11/2026). Esto lo corta en cinco
      # segundos y dice que permiso falta.
      - name: Verificar que el token pueda pushear
        env:
          GIT_REMOTE: https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}
        run: |
          git push --dry-run "$GIT_REMOTE" HEAD:main || {
            echo "::error::El GH_PAT no puede pushear a main. Darle Contents: Read and write en https://github.com/settings/personal-access-tokens"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # sharp achica las seis imagenes a webp. Se instala aca y no en el repo:
      # el sitio es estatico y no tiene package.json en la raiz.
      - name: Instalar sharp
        run: npm install --no-save sharp@0.33.5

      - name: Renovar token, actualizar secreto y rearmar la grilla
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: node .github/scripts/sync-instagram.mjs

      # Esto hacia stefanzweifel/git-auto-commit-action@v5, que son seis lineas
      # de git y una etiqueta movil de un tercero corriendo en un job que tiene
      # el PAT a mano. El push con el PAT (y no con el GITHUB_TOKEN) es lo que
      # dispara el workflow de deploy: GitHub no encadena workflows cuando el
      # push es del propio GITHUB_TOKEN, y el cambio quedaba en el repo sin
      # llegar al sitio.
      - name: Commitear y pushear si la grilla cambio
        env:
          GIT_REMOTE: https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}
        run: |
          git add public/index.html public/img/ig
          if git diff --cached --quiet; then
            echo "La grilla no cambio: no hay nada que commitear."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: actualizar la grilla de Instagram'
          git push "$GIT_REMOTE" HEAD:main
