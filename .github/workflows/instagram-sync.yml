name: Sync Instagram permalink

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

# El GITHUB_TOKEN de este job solo clona. Lo que pushea y lo que escribe el
# secreto es el token de la App, asi que aca no hace falta escritura.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false para que el token del push NO quede escrito
      # en .git/config, donde lo podria leer cualquier paso posterior: el
      # postinstall de sharp, por ejemplo. Se pasa a mano y solo en los pasos
      # que lo necesitan.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # El token de la App sebabru-sitio-sync vive una hora y muere con el job,
      # en vez del PAT que vivia meses guardado como secreto y habia que
      # renovar a mano (si vencia, los dos syncs se caian). Necesita los dos
      # permisos de la App: Contents (el push) y Secrets (guardar el
      # IG_ACCESS_TOKEN renovado).
      #
      # Un push hecho con token de App SI dispara el workflow de deploy: la
      # regla de GitHub de no encadenar workflows es del GITHUB_TOKEN, no de
      # las Apps. Es lo que hace que la grilla llegue al sitio y no se quede en
      # el repo.
      #
      # Clavada al SHA de v2 y no a la etiqueta: esta action recibe la llave
      # privada de la App.
      - name: Pedir un token a la App
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Si el token no puede pushear, cortar ahora. El 23/11/2026 el job
      # renovaba el token, bajaba las seis imagenes y corria sharp para
      # estrellarse recien al final con un 403.
      - name: Verificar que el token pueda pushear
        env:
          GIT_REMOTE: https://x-access-token:${{ steps.token.outputs.token }}@github.com/${{ github.repository }}
        run: |
          git push --dry-run "$GIT_REMOTE" HEAD:main || {
            echo "::error::El token de la App no puede pushear a main. Revisar que sebabru-sitio-sync tenga Contents: Read and write y este instalada en este repo."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # sharp achica las seis imagenes a webp. Se instala aca y no en el repo:
      # el sitio es estatico y no tiene package.json en la raiz.
      - name: Instalar sharp
        run: npm install --no-save sharp@0.33.5

      # GH_TOKEN lo lee el "gh secret set" del script, que es como se guarda el
      # token de Instagram renovado. Para eso hace falta el permiso Secrets de
      # la App; si falta, el sync pushea bien pero deja de renovar el token y
      # en ~60 dias Instagram deja de contestar.
      - name: Renovar token, actualizar secreto y rearmar la grilla
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: node .github/scripts/sync-instagram.mjs

      # Esto hacia stefanzweifel/git-auto-commit-action@v5, que son seis lineas
      # de git y una etiqueta movil de un tercero corriendo en un job que tiene
      # el token a mano.
      - name: Commitear y pushear si la grilla cambio
        env:
          GIT_REMOTE: https://x-access-token:${{ steps.token.outputs.token }}@github.com/${{ github.repository }}
        run: |
          git add public/index.html public/img/ig
          if git diff --cached --quiet; then
            echo "La grilla no cambio: no hay nada que commitear."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: actualizar la grilla de Instagram'
          git push "$GIT_REMOTE" HEAD:main
