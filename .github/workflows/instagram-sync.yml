name: Sync Instagram permalink

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Renovar token, actualizar secreto y sincronizar permalink
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: node .github/scripts/sync-instagram.mjs

      - name: Commitear cambios si el permalink cambio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: actualizar link de Instagram al ultimo posteo"
          file_pattern: public/index.html
