name: Sync miniaturas del podcast

on:
  schedule:
    # Martes 15:00 UTC = 12:00 en Argentina. Seba sube el video del Kit los
    # martes a la manana, asi que al mediodia del martes ya esta publicado y
    # la miniatura del facade queda al dia por el resto de la semana.
    #
    # Si alguna semana el video sale despues del mediodia, la miniatura
    # espera hasta el martes siguiente: para eso esta "Run workflow", que
    # hace exactamente lo mismo a mano.
    - cron: '0 15 * * 2'
  workflow_dispatch:
  # Correr tambien cuando se toca este mismo archivo. Es lo que permite
  # probarlo sin depender del boton "Run workflow", y de paso cada edicion
  # del workflow se verifica sola. El filtro de paths lo deja fuera de
  # cualquier otro push: no corre cuando cambia el sitio.
  push:
    paths:
      - '.github/workflows/sync-miniaturas.yml'
      - '.github/scripts/sync-miniaturas.mjs'

# El GITHUB_TOKEN de este job solo clona. El push va con el GH_PAT, a mano y
# en su propio paso, asi que aca no hace falta permiso de escritura.
permissions:
  contents: read

# Si quedo una corrida anterior colgada, no arrancar dos a la vez sobre main.
concurrency:
  group: sync-miniaturas
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false para que el token del push NO quede escrito
      # en .git/config, donde lo podria leer cualquier paso posterior. Se pasa
      # a mano y solo en los dos pasos que hablan con el remoto.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # El GH_PAT necesita "Contents: write" para el push. Si falta, el 403
      # aparecia al final, despues de instalar ffmpeg y bajar las miniaturas
      # (paso el 23/11/2026 en el sync de Instagram, que comparte el token).
      # Esto lo corta en cinco segundos y dice que permiso falta.
      - name: Verificar que el token pueda pushear
        env:
          GIT_REMOTE: https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}
        run: |
          git push --dry-run "$GIT_REMOTE" HEAD:main || {
            echo "::error::El GH_PAT no puede pushear a main. Darle Contents: Read and write en https://github.com/settings/personal-access-tokens"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ffmpeg es lo que saca el poster del mp4. La imagen de ubuntu-latest
      # NO lo trae: el 18/11/2026 la corrida paso en verde sin generar nada
      # porque el script lo salteo al no encontrarlo. Se instala, no se asume.
      - name: Instalar ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Bajar miniaturas de YouTube y Spotify, y el poster del mp4
        run: node .github/scripts/sync-miniaturas.mjs

      # Esto hacia stefanzweifel/git-auto-commit-action@v5, que son seis lineas
      # de git y una etiqueta movil de un tercero corriendo en un job que tiene
      # el PAT a mano. El push con el PAT (y no con el GITHUB_TOKEN) es lo que
      # dispara el workflow de deploy.
      - name: Commitear y pushear solo si alguna imagen cambio
        env:
          GIT_REMOTE: https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}
        run: |
          git add public/img/kit-youtube.jpg public/img/kit-spotify.jpg public/img/formaciones2026-poster.jpg
          if git diff --cached --quiet; then
            echo "Ninguna miniatura cambio: no hay nada que commitear."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: actualizar miniaturas del podcast'
          git push "$GIT_REMOTE" HEAD:main
