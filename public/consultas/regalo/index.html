<style>
html, body { margin: 0; padding: 0; background: #000; }
/* El menu cerrado no existe (en vez de quedar escondido a la derecha, fuera
   de la pantalla, donde en el celular ensanchaba la pagina); al abrirlo
   entra deslizando. */
.hamburger-menu .menu-list { display: none; }
.hamburger-menu .menu-toggle:checked ~ .menu-list { display: flex; right: 0; animation: menu-entra .6s cubic-bezier(.23,1,.32,1); }
@keyframes menu-entra { from { transform: translateX(100%); } to { transform: none; } }

:root {
    --curso-theme: #ffffff;
    --curso-text: #cccac3;
    --curso-accent: #f7d239;
}

/* ─── Cabecera ─── */
.consulta-cabecera {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 16vh 20px 2vh;
}
.consulta-cabecera h1 {
    color: #fff; font-size: clamp(2rem, 5.5vw, 3.2rem);
    margin: 0 0 6px; letter-spacing: 0.1em; font-weight: 300; text-transform: uppercase;
}
.consulta-cabecera h2 {
    color: var(--curso-theme); font-size: clamp(0.9rem, 2.2vw, 1.2rem);
    margin: 0; font-weight: 300; letter-spacing: 0.06em; text-transform: none;
}
@supports (height: 1lvh) {
    .consulta-cabecera { padding: 16lvh 20px 2lvh; }
}

/* ─── El formulario, que vive en ../formulario.html ─── */

}
#iframe-formulario {
    width: 100%; border: 0; display: block; min-height: 760px;
    background: transparent; overflow: hidden;
}
</style>

<script src="../../medicion.js?v=3"></script>

<script>
// El formulario vive en ../formulario.html (el mismo de /consultas, en modo
// regalo) y desde adentro del iframe nos avisa cuanto mide, para que no
// quede con scroll propio.
(function () {
    const marco = document.getElementById('iframe-formulario');
    window.addEventListener('message', (e) => {
        if (e.origin !== location.origin || !e.data || !e.data.sbAlto) return;
        marco.style.height = (e.data.sbAlto + 8) + 'px';
    });
})();
</script>
