<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>meydibuja</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Drivers de scroll (fixed sections no generan altura) -->
  <div id="scroll-space"></div>

  <!-- Fondo fijo — siempre al final de la pila -->
  <section id="artist-section">
    <div class="artist-inner">
      <img src="assets/mey.jpeg" alt="Mey — ilustradora">
      <p class="artist-name">mey<span>dibuja</span></p>
    </div>
    <footer class="site-footer">
      <a href="https://www.instagram.com/mey.dibuja" target="_blank" rel="noopener noreferrer" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <a href="https://www.facebook.com/meyclerici/" target="_blank" rel="noopener noreferrer" rel="noopener" aria-label="Facebook">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
        </svg>
      </a>
      <a href="mailto:meydibuja@gmail.com" aria-label="Email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <polyline points="2,4 12,13 22,4"/>
        </svg>
      </a>
    </footer>
  </section>

  <!-- Menú: tres puntos fijos, siempre visibles -->
  <button id="menu-btn" aria-label="Abrir menú" aria-expanded="false">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- Overlay del menú -->
  <div id="menu-overlay" role="dialog" aria-hidden="true">
    <ul id="menu-nav">
      <li><a href="#">Quién soy</a></li>
      <li>
        <button id="works-toggle" aria-expanded="false">
          Mis trabajos
          <span class="works-arrow">↓</span>
        </button>
        <ul id="works-list">
          <!-- poblado desde books.js en script.js -->
        </ul>
      </li>
      <li><a href="#">Workshops y cursos</a></li>
    </ul>
  </div>

  <!-- GSAP 3.12.5 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <script src="data/books.js"></script>
  <script src="script.js"></script>

</body>
</html>
