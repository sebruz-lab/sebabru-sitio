<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neptuno, Urano y Quiron | Aula Virtual</title>
    <link rel="icon" type="image/x-icon" href="../../img/favicon.ico">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../escuela.css?v=5">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div id="security-overlay">
        <div class="spinner" id="spinner-icon"></div>
        <div class="texto-seguridad" id="status-text">Verificando acceso...</div>
        <div class="error-seguridad" id="error-msg">
            <p>No se pudo verificar tu acceso.</p>
            <a href="../index.html" class="btn-external">VOLVER A LA ESCUELA</a>
        </div>
    </div>

    <div class="mobile-header">
        <span class="mobile-title">Neptuno, Urano y Quiron</span>
        <button class="hamburger-btn" id="menu-toggle">
            <i class="fa-solid fa-bars"></i> Menu
        </button>
    </div>

    <div class="aula-layout">
        <aside class="sidebar-panel" id="sidebar">
            <div class="sidebar-content">
                <div class="sidebar-header">
                    <h3>Neptuno, Urano y Quiron</h3>
                    <p>Seminario</p>
                </div>

                <a href="https://drive.google.com/open?id=1HupcZ7NrjHxRIWBAPuWO_5bvNGEt_IMa&usp=drive_fs"
                   target="_blank" rel="noopener"
                   class="btn-sidebar-main"
                   style="margin-bottom: 10px;">
                    <i class="fa-solid fa-folder-open"></i> Material Complementario
                </a>

                <nav class="auto-nav">
                    <ul id="lista-clases"></ul>
                </nav>
                <div class="sidebar-footer">
                    <a href="../index.html"><i class="fa-solid fa-arrow-left"></i> Volver a Cursos</a>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <article class="clase-item" id="clase-1" data-titulo="Neptuno 1">
                <header class="clase-header">
                    <h2><span class="num">#1</span> Neptuno 1</h2>
                    <p style="opacity:0.55; font-size:0.88rem; margin-top:4px;">Desarrollo del signo y recorrido de Aries a Leo</p>
                </header>
                <div style="position:relative; padding-top:56.25%; border-radius: 8px; overflow: hidden; margin-bottom: 20px; background-color: #000; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                    <iframe data-src="https://player.mediadelivery.net/embed/615375/9c448f54-67a1-46e7-8387-f25d4da0f044?autoplay=false&loop=false&muted=false&preload=false&responsive=true"
                            loading="lazy" style="border:0; position:absolute; top:0; height:100%; width:100%;"
                            allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture; fullscreen;" allowfullscreen="true"></iframe>
                </div>
            </article>
        </main>
    </div>

    <script type="module" src="../escuela.js?v=2"></script>
    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { auth, db } from '../firebase.js';
        import { poblarVideosClases } from '../escuela.js?v=2';

        let accesoConcedido = false;

        function mostrarError() {
            if (accesoConcedido) return;
            document.getElementById('spinner-icon').style.display = 'none';
            document.getElementById('status-text').style.display = 'none';
            document.getElementById('error-msg').style.display = 'block';
        }

        setTimeout(mostrarError, 12000);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userEmail = user.email.toLowerCase().trim();
                    const docSnap = await getDoc(doc(db, "usuarios", userEmail));

                    if (docSnap.exists() && docSnap.data().cursos?.includes('quiron')) {
                        accesoConcedido = true;
                        await poblarVideosClases('quiron', 615375);
                        const _obs = new IntersectionObserver(entries => {
                            entries.forEach(e => { if (e.isIntersecting) { e.target.src = e.target.dataset.src; _obs.unobserve(e.target); } });
                        }, { rootMargin: '200px' });
                        document.querySelectorAll('iframe[data-src]').forEach(iframe => { _obs.observe(iframe); });
                        document.getElementById('security-overlay').style.display = 'none';
                    } else {
                        accesoConcedido = true;
                        window.location.href = '../sin-acceso/?email=' + encodeURIComponent(userEmail) + '&aula=' + encodeURIComponent('Neptuno, Urano y Quiron');
                    }
                } catch (e) {
                    console.error("Error al verificar el acceso:", e);
                    mostrarError();
                }
            } else {
                accesoConcedido = true;
                window.location.href = "../index.html";
            }
        });
    </script>
</body>
</html>
