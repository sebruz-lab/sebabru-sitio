<!DOCTYPE html>
<html lang="es">
<head>

</head>
<body>

        <div class="error-seguridad" id="error-msg">
            <p>No se pudo verificar tu acceso.</p>
            <a href="../index.html" class="btn-external">VOLVER A LA ESCUELA</a>
        </div>
    </div>

    <div class="mobile-header">
        <span class="mobile-title">La Luna en la carta natal</span>
        <button class="hamburger-btn" id="menu-toggle">
            <i class="fa-solid fa-bars"></i> Menu
        </button>
    </div>

    <div class="aula-layout">
        <aside class="sidebar-panel" id="sidebar">
            <div class="sidebar-content">
                <div class="sidebar-header">
                    <h3>La Luna en la carta natal</h3>
                    <p>Taller sincronico 2026</p>
                </div>

                <a href="https://docs.google.com/document/d/1kxsiX21vaxsbHW6PTX3KhyLBM2DcnQJn?rtpof=true&usp=drive_fs"
                   target="_blank" rel="noopener"
                   class="btn-sidebar-main"
                   style="background-color:var(--secondary-color,#4a4a4a); border:1px solid rgba(255,255,255,0.2); margin-bottom:10px;">
                    <i class="fa-solid fa-book-open"></i> Material de lectura 1
                </a>
                <a href="https://docs.google.com/document/d/1TxqYpj_1RgiSUGIXyK8kvF81adtjOwW_?rtpof=true&usp=drive_fs"
                   target="_blank" rel="noopener"
                   class="btn-sidebar-main"
                   style="background-color:var(--secondary-color,#4a4a4a); border:1px solid rgba(255,255,255,0.2); margin-bottom:10px;">
                    <i class="fa-solid fa-book-open"></i> Material de lectura 2
                </a>
                <a href="https://drive.google.com/open?id=1ES82k5Qimv2RR0avtXTFpNVr8w64c133&usp=drive_fs"
                   target="_blank" rel="noopener"
                   class="btn-sidebar-main"
                   style="margin-bottom:10px;">
                    <i class="fa-solid fa-users"></i> Cartas del grupo
                </a>

                <nav class="auto-nav">
                    <ul id="lista-clases"></ul>
                </nav>
                <div class="sidebar-footer">
                    <a href="../index.html"><i class="fa-solid fa-arrow-left"></i> Volver a Cursos</a>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <article class="clase-item" id="clase-1" data-titulo="Clase 1">
                <header class="clase-header">
                    <h2><span class="num">#1</span> Clase 1</h2>
                </header>
                <div style="position:relative; padding-top:56.25%; border-radius: 8px; overflow: hidden; margin-bottom: 20px; background-color: #000; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                    <iframe data-src="https://www.youtube.com/embed/uha8ifistlY"
                            loading="lazy" style="border:0; position:absolute; top:0; height:100%; width:100%;"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen="true"></iframe>
                </div>
            </article>

            <article class="clase-item" id="clase-2" data-titulo="Luna en Aries">
                <header class="clase-header">
                    <h2><span class="num">#2</span> Luna en Aries</h2>
                </header>
                <div style="position:relative; padding-top:56.25%; border-radius: 8px; overflow: hidden; margin-bottom: 20px; background-color: #000; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                    <iframe data-src="https://player.mediadelivery.net/embed/615375/40e81ccf-028b-4133-8f82-51b51d672090?autoplay=false&loop=false&muted=false&preload=false&responsive=true"
                            loading="lazy" style="border:0; position:absolute; top:0; height:100%; width:100%;"
                            allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture; fullscreen;" allowfullscreen="true"></iframe>
                </div>
            </article>
        </main>
    </div>

    <script type="module" src="../escuela.js"></script>
    <script type="module">
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { auth, db } from '../firebase.js';

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userEmail = user.email.toLowerCase().trim();
                    const docSnap = await getDoc(doc(db, "usuarios", userEmail));

                    if (docSnap.exists() && docSnap.data().cursos?.includes('lunas26')) {
                        const _obs = new IntersectionObserver(entries => {
                            entries.forEach(e => { if (e.isIntersecting) { e.target.src = e.target.dataset.src; _obs.unobserve(e.target); } });
                        }, { rootMargin: '200px' });
                        document.querySelectorAll('iframe[data-src]').forEach(iframe => { _obs.observe(iframe); });
                        document.getElementById('security-overlay').style.display = 'none';
                    } else {
                        alert("No tenes acceso a este taller.");
                        window.location.href = "../index.html";
                    }
                } catch (e) {
                    console.error("Error al verificar el acceso:", e);
                    window.location.href = "../index.html";
                }
            } else {
                window.location.href = "../index.html";
            }
        });
    </script>
</body>
</html>
