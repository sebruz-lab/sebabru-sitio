<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin acceso | Escuela</title>
    <link rel="icon" type="image/x-icon" href="../../img/favicon.ico">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../escuela.css?v=5">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px 16px;
            box-sizing: border-box;
        }
        .card {
            max-width: 460px;
            width: 100%;
            text-align: center;
        }
        .icono {
            font-size: 2.2rem;
            margin-bottom: 28px;
            opacity: 0.35;
        }
        h1 {
            font-size: 1.05rem;
            font-weight: 400;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .aula-tag {
            font-size: 0.8rem;
            opacity: 0.45;
            letter-spacing: 0.06em;
            margin-bottom: 28px;
            min-height: 1em;
        }
        .email-chip {
            display: inline-block;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 100px;
            padding: 8px 22px;
            font-size: 0.88rem;
            margin-bottom: 28px;
            word-break: break-all;
        }
        .mensaje {
            font-size: 0.92rem;
            line-height: 1.65;
            opacity: 0.6;
            margin-bottom: 10px;
        }
        .btns {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 36px;
        }
        .btn-out {
            border: 1px solid rgba(255,255,255,0.28);
            background: transparent;
            color: inherit;
            font-family: inherit;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 13px 20px;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-out:hover { border-color: rgba(255,255,255,0.6); }
        .btn-back {
            background: white;
            color: #000;
            font-family: inherit;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 13px 20px;
            border-radius: 6px;
            text-decoration: none;
            display: block;
        }
        .btn-back:hover { opacity: 0.88; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icono"><i class="fa-solid fa-lock"></i></div>
        <h1>Sin acceso</h1>
        <p class="aula-tag" id="aula-tag"></p>
        <p class="mensaje">No encontramos acceso a este aula para:</p>
        <div class="email-chip" id="email-chip">—</div>
        <p class="mensaje">¿Estás segura que te logueaste con ese mail? ¿No tenés otro email registrado?</p>
        <p class="mensaje">Si te registraste con otra cuenta, cerrá la sesion y volvé a entrar con el mail con el que te habilitamos.</p>
        <div class="btns">
            <button class="btn-out" id="btn-salir">
                <i class="fa-solid fa-right-from-bracket"></i>&nbsp; Cerrar sesion y cambiar cuenta
            </button>
            <a href="../index.html" class="btn-back">Volver a la escuela</a>
        </div>
    </div>
    <script type="module">
        import { signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { auth } from '../firebase.js';

        const params = new URLSearchParams(window.location.search);
        const email = params.get('email');
        const aula = params.get('aula');

        if (aula) document.getElementById('aula-tag').textContent = aula;

        if (email) {
            document.getElementById('email-chip').textContent = email;
        } else {
            onAuthStateChanged(auth, (user) => {
                if (user) document.getElementById('email-chip').textContent = user.email;
            });
        }

        document.getElementById('btn-salir').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = '../index.html';
        });
    </script>
</body>
</html>
