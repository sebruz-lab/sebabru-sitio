    <main class="verif-main">

    <script>
    (function () {
        // La pagina a la que apunta el QR de cada titulo. Lleva el numero y un
        // codigo firmado: sin el codigo, los numeros son correlativos y esto
        // seria un padron de egresadxs recorrible de a uno.
        var URL_VERIFICAR = 'https://us-central1-sebabru-e5563.cloudfunctions.net/verificarTitulo';
        var caja = document.getElementById('verif-caja');

        function escapar(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function noEncontrado(texto) {
            caja.innerHTML =
                '<p class="verif-estado">Sin resultados</p>' +
                '<p style="opacity:.8;">' + escapar(texto) + '</p>' +
                '<p style="opacity:.6; font-size:.9em; margin-top:18px;">El n&uacute;mero y el c&oacute;digo est&aacute;n en el t&iacute;tulo, abajo a la izquierda, y el c&oacute;digo QR lleva a esta p&aacute;gina directo.</p>';
        }

        var params = new URLSearchParams(location.search);
        var n = params.get('n');
        var c = params.get('c');

        if (!n) {
            caja.innerHTML =
                '<p class="verif-estado">Verificaci&oacute;n</p>' +
                '<p style="opacity:.8;">Escane&aacute; el c&oacute;digo QR del t&iacute;tulo, o abr&iacute; el enlace completo que figura en &eacute;l. El n&uacute;mero solo no alcanza.</p>';
            return;
        }

        fetch(URL_VERIFICAR + '?n=' + encodeURIComponent(n) + '&c=' + encodeURIComponent(c || ''))
            .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
            .then(function (res) {
                if (!res.ok || !res.d.ok) {
                    return noEncontrado(res.d.error || 'No encontramos ning&uacute;n t&iacute;tulo con ese n&uacute;mero.');
                }
                var t = res.d;
                caja.innerHTML =
                    '<p class="verif-estado">T&iacute;tulo verificado</p>' +
                    '<p class="verif-nombre">' + escapar(t.nombre) + '</p>' +
                    (t.titulo ? '<p class="verif-rol">' + escapar(t.titulo) + '</p>' : '') +
                    '<p class="verif-dato">' + escapar(t.curso) + '</p>' +
                    '<p class="verif-dato">Escuela de Astrolog&iacute;a de Seba Bru</p>' +
                    '<p class="verif-dato">Emitido el ' + escapar(t.fecha) + '</p>' +
                    '<p class="verif-numero">Certificado N&ordm; ' + escapar(t.numero) + '</p>';
            })
            .catch(function () {
                noEncontrado('No pudimos verificar el t&iacute;tulo en este momento. Prob&aacute; de nuevo en un rato.');
            });
    })();
    </script>
